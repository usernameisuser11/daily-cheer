<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff5f2">
  <meta name="description" content="작은 고양이들과 함께 전하는 한 장의 편지">
  <meta property="og:title" content="작은 마음을 전해요 ♡">
  <meta property="og:description" content="말랑말랑 친구들이 전하는 편지">
  <title>작은 마음을 전해요 ♡</title>
  <style>
    :root{--ink:#5f5260;--pink:#eea9c1;--dark:#987684;--cream:#fff9ec}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100vh;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;color:var(--ink);background:#fff5f1;overflow-x:hidden}
    button{font:inherit}
    .world{min-height:100dvh;position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(180deg,#fff0f0 0%,#fff9e9 62%,#f6f1e1 100%);transition:background 1.5s}
    .world.night{background:linear-gradient(180deg,#8981ab 0%,#b6a0c7 59%,#e0cfe1 100%)}
    .light{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 82% 17%,#fff5ba88,transparent 22%),radial-gradient(circle at 13% 41%,#fffefc7e,transparent 35%);opacity:1;transition:opacity 1.5s}
    .world.night .light{opacity:.35}
    .sun{position:absolute;top:12%;right:13%;width:78px;aspect-ratio:1;background:#ffefb0;border-radius:50%;box-shadow:0 0 50px #fff2bb77;transition:background 1.5s,box-shadow 1.5s;pointer-events:none}
    .world.night .sun{background:#fffbed;box-shadow:0 0 46px #fff9f399}
    .world.night .sun:after{content:'';position:absolute;left:22px;top:-10px;width:80px;height:80px;border-radius:50%;background:#8981ab}
    .cloud{position:absolute;width:138px;height:45px;border:3px solid #f4dfe5;border-radius:60px;background:#fffefe;opacity:.8;animation:drift 13s ease-in-out infinite alternate;pointer-events:none}
    .cloud:before,.cloud:after{content:'';position:absolute;background:inherit;border:inherit;border-bottom:0;border-radius:50% 50% 0 0}
    .cloud:before{width:60px;height:43px;top:-32px;left:23px}.cloud:after{width:54px;height:37px;top:-26px;left:67px}
    .c1{top:15%;left:7%;transform:scale(.85)}.c2{top:27%;right:4%;transform:scale(.63);animation-delay:-4s}
    .stars{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.8s}
    .world.night .stars{opacity:1}
    .star{position:absolute;width:5px;height:5px;background:#fff9dc;transform:rotate(45deg);animation:twinkle 2.5s ease-in-out infinite alternate;opacity:.65}
    .hill{position:absolute;bottom:0;left:-12%;width:124%;height:31%;background:#d7e9d6;border-radius:50% 50% 0 0/32% 36% 0 0;transition:background 1.5s}
    .hill.back{bottom:8%;left:-20%;width:142%;height:25%;background:#e6eedd;border-radius:50% 52% 0 0/48% 43% 0 0}
    .world.night .hill{background:#bcc6d8}.world.night .hill.back{background:#a9bbd2}
    .flower{position:absolute;bottom:clamp(16px,7vh,67px);font-size:26px;transform-origin:bottom center;animation:sway 3.1s ease-in-out infinite alternate;filter:drop-shadow(0 3px 1px #d8bcbc33);pointer-events:none}
    .f1{left:8%}.f2{left:17%;bottom:15%;font-size:18px;animation-delay:-1s}.f3{right:10%;font-size:32px;animation-delay:-1.6s}.f4{right:21%;bottom:13%;font-size:19px;animation-delay:-.5s}
    .content{position:relative;z-index:2;max-width:630px;min-height:100dvh;margin:0 auto;padding:clamp(35px,7vh,65px) 20px 35px;display:flex;flex-direction:column;align-items:center;text-align:center}
    .eyebrow{margin:0 0 9px;font-size:11px;letter-spacing:.24em;font-weight:800;color:#b48b95}
    h1{margin:0;font-size:clamp(29px,7.5vw,43px);letter-spacing:-.055em;color:#885f70;line-height:1.35;font-weight:800;word-break:keep-all}
    .subtitle{font-size:clamp(13px,3.4vw,16px);line-height:1.8;margin:11px 0 0;color:#a4828b;word-break:keep-all}
    .world.night h1{color:#fff9f8}.world.night .subtitle,.world.night .eyebrow{color:#f3e5f3}
    .scene{width:min(100%,480px);height:clamp(245px,42vh,355px);position:relative;margin:12px auto 0;flex-shrink:0}
    .cat{position:absolute;object-fit:contain;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 9px 5px #a3879230);will-change:transform}
    .big{height:auto;width:32%;bottom:11%;z-index:2;animation:bob 2.6s ease-in-out infinite}
    .yellow{left:3%;animation-delay:-.1s}.grey{left:34%;animation-delay:-.85s}.white{right:2%;animation-delay:-1.4s}
    .baby{width:24%;height:auto;z-index:4;bottom:3%;animation:tiny 2.15s ease-in-out infinite}
    .baby.left{left:31%;animation-delay:-.25s}.baby.right{left:50%;animation-delay:-1s}
    .tiny-heart{position:absolute;font-size:22px;animation:heartRise 5s ease-in-out infinite;opacity:0;pointer-events:none}
    .h1{left:22%;top:20%;animation-delay:-3s}.h2{left:56%;top:7%;animation-delay:-1s}.h3{right:17%;top:26%;animation-delay:-4.2s}
    .envelope{border:0;background:transparent;cursor:pointer;position:relative;width:164px;height:107px;margin-top:-3px;filter:drop-shadow(0 10px 11px #be8ca447);transition:transform .3s ease;touch-action:manipulation}
    .envelope:hover{transform:translateY(-5px) rotate(-2deg)}.envelope:active{transform:scale(.96)}
    .env-body{position:absolute;inset:8px 0 0;border-radius:10px;background:#f4acc5;border:2px solid #df90ab;overflow:hidden}
    .env-body:before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,50% 59%,100% 0);background:#fce2e9}
    .env-body:after{content:'';position:absolute;inset:0;clip-path:polygon(0 100%,50% 43%,100% 100%);background:#f9c9d8}
    .seal{position:absolute;left:50%;top:51%;transform:translate(-50%,-25%);z-index:2;background:#fff6f8;color:#d681a1;border-radius:50%;width:39px;height:39px;display:grid;place-items:center;font-size:21px;box-shadow:0 3px 9px #c27e9755}
    .callout{font-size:13px;margin:12px 0 0;color:#a57f8a;font-weight:700;animation:pulse 2.8s ease-in-out infinite}.world.night .callout{color:#fff7f7}
    .mini-tools{margin-top:auto;display:flex;gap:8px;align-items:center;justify-content:center;padding-top:24px}
    .mini-tools button{border:1px solid #e7b8c7a1;border-radius:999px;background:#fffaf8a8;color:#937080;padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;backdrop-filter:blur(8px)}
    .letter-layer{position:fixed;inset:0;display:grid;place-items:center;z-index:10;padding:18px;background:#8d73818c;backdrop-filter:blur(11px);visibility:hidden;opacity:0;transition:opacity .45s,visibility .45s;overflow:auto}
    .letter-layer.open{visibility:visible;opacity:1}
    .paper{position:relative;width:min(100%,530px);max-height:min(90dvh,800px);overflow:auto;padding:clamp(30px,6vw,48px) clamp(24px,6vw,44px) 32px;border-radius:24px;background:linear-gradient(145deg,#fffefb,#fff7f6);box-shadow:0 25px 80px #58445866,0 0 0 1px #f8e2e4;transform:translateY(25px) scale(.96);transition:transform .5s cubic-bezier(.18,.86,.28,1);text-align:left}
    .letter-layer.open .paper{transform:translateY(0) scale(1)}
    .paper:before{content:'';position:absolute;inset:12px;border:1px solid #f5e1df;border-radius:17px;pointer-events:none}
    .paper .tag{font-size:11px;letter-spacing:.2em;color:#c393a1;font-weight:800;margin:0 0 24px}
    .paper h2{font-size:clamp(25px,6vw,32px);color:#a46b82;letter-spacing:-.055em;line-height:1.45;margin:0 0 25px}
    .paper .letter-body{white-space:pre-line;line-height:2.05;font-size:clamp(15px,4vw,17px);color:#75616c;word-break:keep-all}
    .signature{text-align:right;color:#bb7b90;font-weight:700;margin:28px 0 6px}
    .close{position:absolute;right:19px;top:15px;border:0;border-radius:99px;background:#f9e8ee;color:#ab7890;font-weight:800;width:37px;height:37px;cursor:pointer;font-size:21px}
    .small-cat{width:95px;height:auto;display:block;margin:20px auto 0}
    .tip{font-size:11px;color:#c3a6b3;text-align:center;margin-top:25px}
    .tap-heart{position:fixed;z-index:15;pointer-events:none;animation:pop .95s ease-out forwards;font-size:22px}
    @keyframes bob{0%,100%{transform:translateY(1px) rotate(-1.5deg)}50%{transform:translateY(-15px) rotate(2deg)}}
    @keyframes tiny{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-11px) rotate(4deg)}}
    @keyframes heartRise{0%{transform:translateY(40px) scale(.5);opacity:0}20%{opacity:.8}80%{opacity:.4}100%{transform:translateY(-75px) scale(1.35) rotate(15deg);opacity:0}}
    @keyframes sway{to{transform:rotate(12deg)}}@keyframes drift{to{margin-left:28px}}@keyframes twinkle{to{opacity:.2;transform:scale(.5) rotate(45deg)}}
    @keyframes pulse{50%{opacity:.6}}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-150px) rotate(18deg) scale(1.2)}}
    @media(min-width:760px){.content{justify-content:center}.scene{margin-top:10px}.mini-tools{margin-top:25px}}
    @media(max-width:390px){.content{padding:36px 10px 24px}.scene{height:270px;margin-top:10px}.big{width:33%}.baby{width:25%}.envelope{margin-top:0}.mini-tools{padding-top:13px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}html{scroll-behavior:auto}}
  </style>
</head>

  </div>
  <script>
    const world=document.getElementById('world');
    const layer=document.getElementById('letterLayer');
    const openButton=document.getElementById('openLetter');
    const closeButton=document.getElementById('closeLetter');
    const paper=document.getElementById('paper');
    const modeButton=document.getElementById('modeButton');
    let previousFocus;
    for(let i=0;i<58;i++){
      const s=document.createElement('i');s.className='star';
      s.style.left=((i*31.77+Math.sin(i*4)*11)%96+2)+'%';
      s.style.top=((i*19.53+Math.cos(i*3)*9)%50+4)+'%';
      s.style.animationDelay=(-i*.17)+'s';
      document.getElementById('stars').appendChild(s);
    }
    function openLetter(){previousFocus=document.activeElement;layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.body.style.overflow='hidden';setTimeout(()=>paper.focus(),220)}
    function closeLetter(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.body.style.overflow='';if(previousFocus)previousFocus.focus()}
    openButton.addEventListener('click',openLetter);
    closeButton.addEventListener('click',closeLetter);
    layer.addEventListener('click',e=>{if(e.target===layer)closeLetter()});
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.classList.contains('open'))closeLetter()});
    modeButton.addEventListener('click',()=>{const night=world.classList.toggle('night');modeButton.textContent=night?'☀ 낮하늘 보기':'☾ 밤하늘 보기';modeButton.setAttribute('aria-pressed',String(night))});
    function heart(x,y){const h=document.createElement('span');h.className='tap-heart';h.textContent=['💗','💕','💛','♡'][Math.floor(Math.random()*4)];h.style.left=x+'px';h.style.top=y+'px';document.body.appendChild(h);h.addEventListener('animationend',()=>h.remove())}
    document.getElementById('heartButton').addEventListener('click',e=>{const r=e.target.getBoundingClientRect();for(let i=0;i<5;i++)setTimeout(()=>heart(r.left+r.width/2+(i-2)*16,r.top),i*95)});
    document.querySelector('.scene').addEventListener('pointerdown',e=>heart(e.clientX,e.clientY));
  </script>
